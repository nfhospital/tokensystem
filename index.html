<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Pharmacy Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { 
      var(--primary): #078c80; /* Unga Hospital Brand Color */
      --success: #16a34a; --dark: #1e293b; --danger: #dc2626; 
      --bg: #f1f5f9; --card-bg: #ffffff; --text: #334155;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; width: 100%; }
    .card { background: var(--card-bg); padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-top: 5vh; }
    h1 { color: var(--dark); text-align: center; margin-top: 0; }
    
    .btn-link { display: block; padding: 18px; border-radius: 12px; border: none; font-weight: 600; text-align: center; text-decoration: none; margin-bottom: 15px; color: white; cursor: pointer; }
    .bg-brand { background-color: #078c80; }
    .bg-green { background-color: var(--success); }
    .bg-dark { background-color: var(--dark); }
    .bg-red { background-color: var(--danger); }
    
    .view-section { display: none; width: 100%; }
    .view-active { display: block; }
    
    input[type="text"] { width: 100%; padding: 16px; margin-bottom: 20px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 1.1rem; box-sizing: border-box; }
    input[type="text"]:focus { border-color: #078c80; outline: none; }
    
    button.action-btn { width: 100%; padding: 16px; background: #078c80; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 1.1rem; }
    .result { margin-top: 20px; padding: 18px; border-radius: 10px; text-align: center; font-weight: 600; }
    
    /* Delivery Grid CSS */
    .header-bar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; }
    .token-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .token-card { background: #fff; border-radius: 12px; padding: 20px; text-align: center; }
    .token-card h2 { font-size: 3.5rem; margin: 0; }
    .token-card.emergency { background: #fef2f2; border: 2px solid #fecaca; }
    .token-card.emergency h2 { color: var(--danger); }
    .actions button { flex: 1; padding: 12px; border-radius: 8px; border: none; color: white; cursor: pointer; width: 48%; margin: 1%; font-weight: bold; }
    
    /* TV CSS */
    body.tv-mode { margin: 0; padding: 0; background: #000; overflow: hidden; }
    #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 140, 128, 0.96); /* Normal Hospital Color Popup */ color: white; display: none; justify-content: center; align-items: center; flex-direction: column; text-align: center; z-index: 1000; }
    #popup.popup-emergency { background: rgba(220, 38, 38, 0.96); /* Red Popup for EM */ }
    #popup .token-number { font-size: 25vw; font-weight: 800; line-height: 1; }
    #unmute-button { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5000; padding: 20px 40px; font-size: 2rem; border-radius: 50px; background: white; color: black; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <!-- PAGE ROUTING TABS -->
  <div style="text-align: center; margin-bottom: 15px; display: flex; gap: 10px; justify-content: center;" id="nav-menu">
    <button onclick="switchView('home')" class="action-btn bg-dark" style="width: auto; padding: 10px 20px;">Home</button>
    <button onclick="switchView('create')" class="action-btn bg-brand" style="width: auto; padding: 10px 20px;">Counter</button>
    <button onclick="switchView('delivery')" class="action-btn bg-green" style="width: auto; padding: 10px 20px;">Pharmacy</button>
    <button onclick="switchView('display')" class="action-btn bg-dark" style="width: auto; padding: 10px 20px;">TV</button>
  </div>

  <!-- HOME PAGE -->
  <div id="view-home" class="view-section view-active container">
    <div class="card">
      <h1>Pharmacy Hub</h1>
      <p style="text-align: center;">Select an option above to navigate.</p>
    </div>
  </div>

  <!-- CREATE PAGE -->
  <div id="view-create" class="view-section container">
    <div class="card">
      <h1 style="color: #078c80;">New Token</h1>
      <input type="text" id="patientName" placeholder="Enter Normal Patient Name">
      <button onclick="submitToken(false)" class="action-btn bg-brand">Generate Normal Token</button>
      
      <hr style="margin: 30px 0;">
      <h1 style="color: var(--danger);">Emergency Token</h1>
      <input type="text" id="emPatientName" placeholder="Enter Emergency Name" style="background:#fef2f2; border-color:#fecaca;">
      <button onclick="submitToken(true)" class="action-btn bg-red">Generate EMERGENCY Token</button>
      
      <div id="result" class="result" style="display:none;"></div>
    </div>
  </div>

  <!-- DELIVERY PAGE -->
  <div id="view-delivery" class="view-section container">
    <div class="header-bar">
      <h1>Active Prescriptions</h1>
      <button onclick="loadTokens()" style="padding: 10px; font-weight: bold; cursor: pointer;">🔄 Refresh</button>
    </div>
    <div id="tokenGrid" class="token-grid"></div>
  </div>

  <!-- TV PAGE -->
  <div id="view-display" class="view-section">
    <div id="player"></div>
    <div id="popup">
      <div style="font-size: 5vw; font-weight: 600; color: #ccfbf1;">Please Collect Medicine</div>
      <div id="popup-token" class="token-number"></div>
      <div id="popup-name" style="font-size: 6vw; margin-top: 20px;"></div>
    </div>
    <button id="unmute-button">Tap to Start System</button>
  </div>

  <script>
    // ==========================================
    // PUT YOUR DEPLOYED GOOGLE SCRIPT URL HERE!
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbxXuQyAIC5x_YtxFJN8tvv6ppoZaDCXdxDdwJgbVHjPiVlnHs_lFJLea-c4uceVfJjx/exec"; 

    function switchView(view) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('view-active'));
      document.getElementById('view-' + view).classList.add('view-active');
      document.getElementById('nav-menu').style.display = (view === 'display') ? 'none' : 'flex';
      
      if (view === 'display') {
        document.body.classList.add('tv-mode');
        initTV();
      } else {
        document.body.classList.remove('tv-mode');
        if(view === 'delivery') loadTokens();
      }
    }

    async function apiCall(action, params = {}) {
      const url = new URL(API_URL);
      url.searchParams.append('action', action);
      Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
      
      const response = await fetch(url);
      return response.json();
    }

    // --- CREATE LOGIC ---
    async function submitToken(isEmergency) {
      const inputId = isEmergency ? 'emPatientName' : 'patientName';
      const name = document.getElementById(inputId).value;
      if(!name) return alert("Enter name");
      
      const res = await apiCall('createToken', { name: name, isEmergency: isEmergency });
      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      if(res.success) {
        resultDiv.innerHTML = `✅ Token <strong>#${res.token}</strong> generated!`;
        resultDiv.style.backgroundColor = "#dcfce7";
        document.getElementById(inputId).value = '';
      }
    }

    // --- DELIVERY LOGIC ---
    async function loadTokens() {
      const tokens = await apiCall('getActiveTokens');
      const grid = document.getElementById('tokenGrid');
      grid.innerHTML = '';
      
      tokens.forEach(t => {
        const isReady = t.status === 'Ready';
        const isEm = String(t.token).startsWith('EM');
        
        grid.innerHTML += `
          <div class="token-card ${isEm ? 'emergency' : ''}">
            <h2>${isEm ? t.token : '#'+t.token}</h2>
            <p>${t.name}</p>
            <div class="actions">
              <button class="bg-green" onclick="updateStatus('${t.token}', 'Ready')">${isReady ? 'Re-Announce' : 'Ready'}</button>
              <button class="bg-dark" onclick="updateStatus('${t.token}', 'Delivered')">Clear</button>
            </div>
          </div>`;
      });
    }

    async function updateStatus(token, status) {
      await apiCall('updateToken', { token, status });
      loadTokens();
    }
    setInterval(() => { if(document.body.classList.contains('tv-mode') === false) loadTokens(); }, 6000);

    // --- TV LOGIC (Fix applied for Chrome Autoplay & EM Red) ---
    let player;
    function initTV() {
      var tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    async function onYouTubeIframeAPIReady() {
      const videos = await apiCall('getVideoUrls');
      if(videos.length > 0) {
        player = new YT.Player('player', {
          playerVars: { 'autoplay': 1, 'controls': 0, 'loop': 1, 'playlist': videos.join(','), 'mute': 0 },
          events: { 'onStateChange': (e) => { 
            if (e.data === YT.PlayerState.UNSTARTED || e.data === YT.PlayerState.PAUSED) {
                // If browser blocks autoplay, button shows up. Otherwise it plays directly.
                document.getElementById('unmute-button').style.display = 'block';
            } else {
                document.getElementById('unmute-button').style.display = 'none';
            }
          }}
        });
      }
      setInterval(checkReadyTokens, 15000);
      
      document.getElementById('unmute-button').onclick = () => {
         player.playVideo();
         document.getElementById('unmute-button').style.display = 'none';
         if ('speechSynthesis' in window) {
            let msg = new SpeechSynthesisUtterance(" "); msg.volume = 0; window.speechSynthesis.speak(msg);
         }
      };
    }

    let currentCycleIndex = 0;
    async function checkReadyTokens() {
      if (document.getElementById('popup').style.display === 'flex') return;
      const readyTokens = await apiCall('getReadyTokens');
      if(readyTokens.length === 0) { currentCycleIndex = 0; return; }
      
      if(currentCycleIndex >= readyTokens.length) currentCycleIndex = 0;
      displayPopup(readyTokens[currentCycleIndex]);
      currentCycleIndex++;
    }

    function displayPopup(t) {
      if(player) player.pauseVideo();
      
      const popup = document.getElementById('popup');
      // Emergency Background Check
      if(String(t.token).startsWith('EM')) {
        popup.classList.add('popup-emergency');
      } else {
        popup.classList.remove('popup-emergency');
      }
      
      document.getElementById('popup-token').innerText = t.token;
      document.getElementById('popup-name').innerText = t.name;
      popup.style.display = 'flex';
      
      if ('speechSynthesis' in window) {
         window.speechSynthesis.cancel();
         setTimeout(() => {
           const msg = new SpeechSynthesisUtterance("Token number " + t.token);
           msg.lang = 'en-IN';
           window.speechSynthesis.speak(msg);
         }, 500);
      }
      
      setTimeout(() => {
        popup.style.display = 'none';
        if(player) player.playVideo();
      }, 10000);
    }
  </script>
</body>
</html>
