<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Pharmacy - Neuro Foundation</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <style>
    :root { 
      --brand: #078c80; /* Neuro Foundation Color */
      --brand-hover: #067268;
      --danger: #ef4444; 
      --danger-hover: #dc2626;
      --bg: #f8fafc; 
      --text: #1e293b;
      --card-bg: #ffffff;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; min-height: 100vh; }
    
    /* Professional Navbar */
    .navbar { background: var(--brand); padding: 15px 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; justify-content: center; gap: 10px; position: sticky; top: 0; z-index: 100; }
    .nav-btn { background: rgba(255,255,255,0.15); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; text-decoration: none; font-size: 1rem; }
    .nav-btn:hover, .nav-btn.active { background: white; color: var(--brand); }
    
    .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
    .card { background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; }
    
    /* Inputs & Buttons */
    .input-group { margin-bottom: 25px; }
    .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #475569; }
    input[type="text"] { width: 100%; padding: 15px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 1.1rem; box-sizing: border-box; transition: 0.3s; background: #f8fafc; }
    input[type="text"]:focus { border-color: var(--brand); outline: none; background: white; box-shadow: 0 0 0 3px rgba(7,140,128,0.1); }
    
    .em-input { border-color: #fca5a5 !important; background: #fef2f2 !important; }
    .em-input:focus { border-color: var(--danger) !important; box-shadow: 0 0 0 3px rgba(239,68,68,0.1) !important; }

    button.btn { width: 100%; padding: 16px; color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
    .btn-brand { background: var(--brand); }
    .btn-brand:hover { background: var(--brand-hover); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: var(--danger-hover); }
    
    /* Delivery Grid */
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .token-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .token-card { background: #fff; border-radius: 14px; padding: 25px 20px; text-align: center; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.04); position: relative; overflow: hidden; }
    .token-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: var(--brand); }
    .token-card.emergency::before { background: var(--danger); }
    .token-card.emergency { background: #fef2f2; border-color: #fecaca; }
    .token-card h2 { font-size: 3.5rem; margin: 0; color: var(--text); line-height: 1.2; }
    .token-card p { font-size: 1.2rem; color: #64748b; margin: 10px 0 20px; font-weight: 500; }
    
    .actions { display: flex; gap: 10px; }
    .actions button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; color: white; }
    .btn-ready { background: var(--brand); }
    .btn-clear { background: #94a3b8; }
    .btn-clear:hover { background: #64748b; }
    
    .view-section { display: none; animation: fadeIn 0.3s ease; }
    .view-active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Loader */
    .loader { display: none; text-align: center; padding: 20px; color: #64748b; font-weight: 600; }
    .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid rgba(7,140,128,0.2); border-top-color: var(--brand); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* TV Display CSS */
    body.tv-mode .navbar { display: none; }
    body.tv-mode { background: #000; overflow: hidden; }
    #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 140, 128, 0.95); color: white; display: none; justify-content: center; align-items: center; flex-direction: column; text-align: center; z-index: 1000; backdrop-filter: blur(10px); }
    #popup.popup-emergency { background: rgba(220, 38, 38, 0.95); }
    #popup .token-number { font-size: 25vw; font-weight: 800; line-height: 1; text-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    #unmute-button { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5000; padding: 20px 40px; font-size: 2rem; border-radius: 50px; background: white; color: black; border: none; cursor: pointer; font-weight: bold; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar" id="nav-menu">
    <a href="#counter" class="nav-btn" id="nav-counter">Counter</a>
    <a href="#pharmacy" class="nav-btn" id="nav-pharmacy">Pharmacy</a>
    <a href="#tv" class="nav-btn" id="nav-tv">TV Display</a>
  </nav>

  <!-- COUNTER -->
  <div id="view-counter" class="view-section container">
    <div class="card">
      <h2 style="color: var(--brand); margin-top: 0; display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 1.5rem;">🟢</span> Normal Token
      </h2>
      <div class="input-group">
        <label>Patient Name</label>
        <input type="text" id="patientName" placeholder="Enter patient name..." autocomplete="off">
      </div>
      <button onclick="submitToken(false)" class="btn btn-brand" id="btn-normal">Generate Normal Token</button>
      
      <hr style="margin: 40px 0; border: none; border-top: 2px dashed #e2e8f0;">
      
      <h2 style="color: var(--danger); margin-top: 0; display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 1.5rem;">🔴</span> Emergency Token
      </h2>
      <div class="input-group">
        <label style="color: var(--danger);">Emergency Patient Name</label>
        <input type="text" id="emPatientName" class="em-input" placeholder="Enter emergency name..." autocomplete="off">
      </div>
      <button onclick="submitToken(true)" class="btn btn-danger" id="btn-em">Generate EMERGENCY Token</button>
      
      <div id="result-msg" style="margin-top: 20px; text-align: center; font-weight: bold; font-size: 1.2rem;"></div>
    </div>
  </div>

  <!-- PHARMACY -->
  <div id="view-pharmacy" class="view-section container">
    <div class="header-bar">
      <h2 style="margin: 0;">Active Prescriptions</h2>
      <button onclick="loadTokens()" style="padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 8px; border: 1px solid #cbd5e1; background: white;">🔄 Refresh</button>
    </div>
    
    <div id="loader" class="loader">
      <div class="spinner"></div><br>Syncing...
    </div>
    <div id="tokenGrid" class="token-grid"></div>
  </div>

  <!-- TV DISPLAY -->
  <div id="view-tv" class="view-section">
    <div id="player"></div>
    <div id="popup">
      <div style="font-size: 4vw; font-weight: 600; color: rgba(255,255,255,0.9); margin-bottom: 20px;">PLEASE COLLECT MEDICINE</div>
      <div id="popup-token" class="token-number"></div>
      <div id="popup-name" style="font-size: 5vw; margin-top: 20px; font-weight: 600;"></div>
    </div>
    <button id="unmute-button">Tap to Start System</button>
  </div>

  <script>
    // =================================================================
    // ⚠️ REPLACE THIS WITH YOUR APPS SCRIPT URL
    // =================================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbxXuQyAIC5x_YtxFJN8tvv6ppoZaDCXdxDdwJgbVHjPiVlnHs_lFJLea-c4uceVfJjx/exec"; 

    // --- 1. HASH ROUTING ---
    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('load', handleRoute);

    function handleRoute() {
      let hash = window.location.hash.replace('#', '') || 'counter';
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('view-active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      const targetView = document.getElementById('view-' + hash);
      if(targetView) {
        targetView.classList.add('view-active');
        if(document.getElementById('nav-' + hash)) document.getElementById('nav-' + hash).classList.add('active');
      }

      if (hash === 'tv') {
        document.body.classList.add('tv-mode');
        initTV();
      } else {
        document.body.classList.remove('tv-mode');
        if (hash === 'pharmacy') loadTokens();
      }
    }

    // --- 2. ROBUST API CALL ---
    async function apiCall(action, params = {}) {
      try {
        const url = new URL(API_URL);
        url.searchParams.append('action', action);
        Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
        
        const response = await fetch(url);
        return await response.json();
      } catch (error) {
        return { error: true, message: "Network error" };
      }
    }

    // --- 3. COUNTER LOGIC ---
    async function submitToken(isEmergency) {
      const inputId = isEmergency ? 'emPatientName' : 'patientName';
      const btnId = isEmergency ? 'btn-em' : 'btn-normal';
      const name = document.getElementById(inputId).value.trim();
      
      if(!name) return alert("Please enter patient name");
      
      document.getElementById(btnId).innerText = "Generating...";
      document.getElementById(btnId).disabled = true;

      const res = await apiCall('createToken', { name: name, isEmergency: isEmergency });
      
      document.getElementById(btnId).innerText = isEmergency ? "Generate EMERGENCY Token" : "Generate Normal Token";
      document.getElementById(btnId).disabled = false;
      
      const msgDiv = document.getElementById('result-msg');
      if(res && res.success) {
        msgDiv.innerHTML = `<span style="color:var(--brand)">✅ Token #${res.token} created successfully!</span>`;
        document.getElementById(inputId).value = '';
        setTimeout(() => { msgDiv.innerHTML = ''; }, 4000);
      }
    }

    // --- 4. PHARMACY LOGIC ---
    async function loadTokens() {
      document.getElementById('loader').style.display = 'block';
      const tokens = await apiCall('getActiveTokens');
      document.getElementById('loader').style.display = 'none';
      
      const grid = document.getElementById('tokenGrid');
      grid.innerHTML = '';
      
      if (tokens.error || !Array.isArray(tokens)) {
         grid.innerHTML = `<p style="color:red; width:100%; text-align:center;">API Error: Please check deployment.</p>`;
         return;
      }
      if (tokens.length === 0) {
         grid.innerHTML = `<p style="color:#64748b; width:100%; text-align:center; padding: 30px;">No active prescriptions waiting.</p>`;
         return;
      }

      tokens.forEach(t => {
        const isReady = t.status === 'Ready';
        const isEm = String(t.token).startsWith('EM');
        
        grid.innerHTML += `
          <div class="token-card ${isEm ? 'emergency' : ''}">
            <h2 style="color: ${isEm ? 'var(--danger)' : 'var(--brand)'}">${isEm ? t.token : '#'+t.token}</h2>
            <p>${t.name}</p>
            <div class="actions">
              <button class="btn-ready" style="background: ${isReady ? '#0ea5e9' : 'var(--brand)'}" onclick="updateStatus('${t.token}', 'Ready')">${isReady ? 'Re-Announce' : 'Mark Ready'}</button>
              <button class="btn-clear" onclick="updateStatus('${t.token}', 'Delivered')">Clear</button>
            </div>
          </div>`;
      });
    }

    async function updateStatus(token, status) {
      await apiCall('updateToken', { token, status });
      loadTokens();
    }
    
    setInterval(() => { if(window.location.hash.replace('#', '') === 'pharmacy') loadTokens(); }, 6000);

    // --- 5. TV LOGIC (PERFECT SYNC FIXES APPLIED) ---
    let player;
    let systemInteracted = false;
    let previousReadyTokens = [];
    let priorityQueue = [];
    let loopIndex = 0;
    
    // New variables for Sync control
    let popupTimeout;
    let isFetching = false;

    function initTV() {
      if(document.getElementById('yt-api-script')) return;
      var tag = document.createElement('script');
      tag.id = 'yt-api-script';
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    async function onYouTubeIframeAPIReady() {
      const videos = await apiCall('getVideoUrls');
      if (Array.isArray(videos) && videos.length > 0) {
        player = new YT.Player('player', {
          playerVars: { 'autoplay': 1, 'controls': 0, 'loop': 1, 'playlist': videos.join(','), 'mute': 0, 'rel': 0, 'modestbranding': 1, 'iv_load_policy': 3 },
          events: { 'onStateChange': (e) => { 
            if ((e.data === YT.PlayerState.UNSTARTED || e.data === YT.PlayerState.PAUSED) && !systemInteracted) {
                document.getElementById('unmute-button').style.display = 'block';
            } else {
                document.getElementById('unmute-button').style.display = 'none';
            }
          }}
        });
      }
      setInterval(checkReadyTokens, 15000);
      
      document.getElementById('unmute-button').onclick = () => {
         systemInteracted = true;
         document.getElementById('unmute-button').style.display = 'none';
         if(player && typeof player.playVideo === 'function') player.playVideo();
         if ('speechSynthesis' in window) {
            let msg = new SpeechSynthesisUtterance("System active"); msg.volume = 0; window.speechSynthesis.speak(msg);
         }
      };
    }

    async function checkReadyTokens() {
      // OVERLAP LOCK: Screen-la popup irunthalo, allathu already fetch aagitu irunthalo thirumba fetch panna koodathu
      if (document.getElementById('popup').style.display === 'flex' || isFetching) return; 
      
      isFetching = true;
      try {
        const currentReadyTokens = await apiCall('getReadyTokens');
        
        if(!Array.isArray(currentReadyTokens) || currentReadyTokens.length === 0) {
          previousReadyTokens = [];
          priorityQueue = [];
          return;
        }

        const newTokens = currentReadyTokens.filter(curr => !previousReadyTokens.some(prev => prev.token === curr.token));
        previousReadyTokens = currentReadyTokens;
        
        newTokens.forEach(t => priorityQueue.unshift(t));

        let tokenToDisplay;
        if (priorityQueue.length > 0) {
           tokenToDisplay = priorityQueue.shift();
        } else {
           if (loopIndex >= currentReadyTokens.length) loopIndex = 0;
           tokenToDisplay = currentReadyTokens[loopIndex];
           loopIndex++;
        }

        displayPopup(tokenToDisplay);
      } finally {
        isFetching = false;
      }
    }

    function speakWithFemaleVoice(tokenText) {
      if (!('speechSynthesis' in window)) return;
      
      const msg = new SpeechSynthesisUtterance(tokenText);
      msg.rate = 0.85; 
      msg.pitch = 1.1; 
      
      let voices = window.speechSynthesis.getVoices();
      let femaleVoice = voices.find(v => 
         v.name.includes('Google UK English Female') || 
         v.name.includes('Google US English') ||
         v.name.includes('Zira') ||
         (v.lang === 'en-IN' && v.name.includes('Female'))
      );
      
      if (!femaleVoice) femaleVoice = voices.find(v => v.lang.includes('en-IN') || v.name.includes('Female'));
      if (femaleVoice) msg.voice = femaleVoice;
      
      window.speechSynthesis.speak(msg);
    }

    function displayPopup(t) {
      // 1. Pause Video completely
      if(player && typeof player.pauseVideo === 'function') player.pauseVideo();
      
      document.getElementById('unmute-button').style.display = 'none'; 
      systemInteracted = true; 

      const popup = document.getElementById('popup');
      if(String(t.token).startsWith('EM')) {
        popup.classList.add('popup-emergency');
      } else {
        popup.classList.remove('popup-emergency');
      }
      
      document.getElementById('popup-token').innerText = String(t.token).startsWith('EM') ? t.token : '#' + t.token;
      document.getElementById('popup-name').innerText = t.name;
      
      // 2. CLEAR ALL PREVIOUS TIMERS & VOICES (This strictly ties voice and display together)
      clearTimeout(popupTimeout);
      if ('speechSynthesis' in window) {
         window.speechSynthesis.cancel();
      }

      // 3. SHOW DISPLAY FIRST
      popup.style.display = 'flex';
      
      // 4. TRIGGER VOICE EXACTLY WHEN DISPLAY APPEARS
      setTimeout(() => {
        speakWithFemaleVoice("Token number " + t.token);
      }, 100);
      
      // 5. REMOVE DISPLAY EXACTLY AFTER 10 SECONDS
      popupTimeout = setTimeout(() => {
        popup.style.display = 'none';
        if(player && typeof player.playVideo === 'function') player.playVideo();
      }, 10000);
    }
  </script>
</body>
</html>
